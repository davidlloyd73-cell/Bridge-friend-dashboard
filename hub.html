<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>David's Dashboard</title>
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0E2338" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F3EFE6" media="(prefers-color-scheme: light)" />
  <script src="theme.js?v=20261030a"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=IBM+Plex+Mono:wght@400;600&amp;family=Spectral:wght@400;600&amp;display=swap" />
  <link rel="stylesheet" href="tokens.css?v=20261030a" />
  <link rel="stylesheet" href="hub.css?v=20261030a" />
</head>
<body>
  <header class="hub-header">
    <h1>David's Dashboard</h1>
    <div class="header-status">
      <span id="hub-updated" class="muted">Loading…</span>
    </div>
  </header>

  <main class="hub-grid">
    <section class="win win-bridge" aria-labelledby="h-bridge">
      <div class="win-head">
        <h2 id="h-bridge">♠ Bridge Friends</h2>
        <span class="win-links"><a href="race.html">Race to 50,000</a> · <a href="index.html">Open full</a></span>
      </div>
      <iframe class="bridge-frame" src="index.html" title="Bridge Friends live dashboard" loading="lazy"></iframe>
    </section>

    <section class="win" aria-labelledby="h-art">
      <div class="win-head"><h2 id="h-art">🖼 Art &amp; exhibitions</h2></div>
      <ul class="news" id="news-art"><li class="muted">Loading…</li></ul>
    </section>

    <section class="win" aria-labelledby="h-film">
      <div class="win-head"><h2 id="h-film">🎬 Film</h2></div>
      <ul class="news" id="news-film"><li class="muted">Loading…</li></ul>
    </section>

    <section class="win" aria-labelledby="h-theatre">
      <div class="win-head"><h2 id="h-theatre">🎭 London theatre</h2></div>
      <ul class="news" id="news-theatre"><li class="muted">Loading…</li></ul>
    </section>

    <section class="win win-doom" aria-labelledby="h-doom">
      <div class="win-head"><h2 id="h-doom">☠ The Doom Desk</h2></div>
      <div class="doom-meter" aria-live="polite">
        <div class="doom-bar"><div class="doom-fill" id="doom-fill"></div></div>
        <p class="doom-read" id="doom-read">Calibrating dread…</p>
      </div>
      <ul class="news news-small" id="news-doom"><li class="muted">Loading…</li></ul>
      <p class="doom-foot">Not medical advice. Not any other kind either.</p>
    </section>
  </main>

  <script src="hub.js?v=20261030a"></script>
</body>
</html>
